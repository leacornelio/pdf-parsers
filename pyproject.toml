[project]
name = "pdf-parsers"
version = "0.1.0"
description = ""
authors = [
    {name = "Oskar Liew", email = "oskar@liew.se"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.5.1,<3.0.0",
    "torchvision>=0.20.1,<1.0.0",
    "transformers>=4.45.2,<4.50.0",
    "tiktoken>=0.8.0,<1.0.0",
    "verovio>=4.4.0,<5.0.0",
    "accelerate>=1.1.1,<2.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "google-genai>=1.1.0,<2.0.0",
    "python-dotenv>=1.1.1,<2.0.0",
    "pydantic>=2.11.7,<3.0.0",
    "typer>=0.16.0,<1.0.0",
    "openai>=1.95.0,<2.0.0",
    "ollama>=0.5.1,<1.0.0",
    "rapidocr-onnxruntime>=1.4.4,<2.0.0",
    "docling>=2.8.1,<3.0.0",
    "pypdf>=5.1.0,<6.0.0",
    "pymupdf>=1.24.14,<2.0.0",
    "pymupdf4llm>=0.0.17,<1.0.0",
    "pdfminer>=20191125,<20200000",
    "pdfplumber>=0.11.4,<1.0.0",
    "llmsherpa>=0.1.4,<1.0.0",
    "unstructured[all-docs]>=0.16.9,<1.0.0",
    "marker-pdf>=1.0.1,<2.0.0",
    "pypdfium2>=4.30.0,<5.0.0",
    "pdftext>=0.3.19,<1.0.0",
    "llama-parse>=0.5.15,<1.0.0",
    "markitdown>=0.0.1a2,<1.0.0",
    "python-levenshtein>=0.26.1,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
extend-include = ["*.ipynb"]

